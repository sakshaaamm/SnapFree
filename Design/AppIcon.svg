<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#9BE7FF"/>
      <stop offset="40%" stop-color="#4FC3F7"/>
      <stop offset="75%" stop-color="#1E9BF0"/>
      <stop offset="100%" stop-color="#1273D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3F5FF"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#C8F1FF"/>
      <stop offset="35%" stop-color="#38B6FF"/>
      <stop offset="75%" stop-color="#1A6FE0"/>
      <stop offset="100%" stop-color="#0B3D91"/>
    </radialGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6F3FF"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A3A7A" flood-opacity="0.4"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A3A7A" flood-opacity="0.3"/>
    </filter>
    <clipPath id="sq"><rect x="32" y="32" width="448" height="448" rx="104"/></clipPath>
  </defs>

  <!-- Background -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="32" y="32" width="448" height="448" fill="url(#glow)"/>
    <circle cx="430" cy="440" r="150" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="80" cy="470" r="110" fill="#FFFFFF" opacity="0.07"/>
  </g>

  <!-- Viewfinder corners -->
  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#soft)">
    <path d="M 104 172 L 104 104 L 172 104"/>
    <path d="M 340 104 L 408 104 L 408 172"/>
    <path d="M 408 340 L 408 408 L 340 408"/>
    <path d="M 172 408 L 104 408 L 104 340"/>
  </g>

  <!-- Glass card -->
  <g filter="url(#drop)">
    <rect x="146" y="146" width="220" height="220" rx="56" fill="url(#card)"/>
  </g>
  <rect x="146" y="146" width="220" height="110" rx="56" fill="#FFFFFF" opacity="0.35"/>

  <!-- Lens -->
  <circle cx="256" cy="256" r="74" fill="url(#lens)"/>
  <circle cx="256" cy="256" r="74" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5"/>
  <circle cx="256" cy="256" r="34" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="228" cy="222" rx="24" ry="13" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 228 222)"/>

  <!-- Snap spark -->
  <g filter="url(#soft)">
    <path d="M 388 96 C 392 124 400 132 428 136 C 400 140 392 148 388 176 C 384 148 376 140 348 136 C 376 132 384 124 388 96 Z" fill="url(#spark)"/>
  </g>
  <circle cx="440" cy="196" r="8" fill="#FFFFFF"/>
</svg>
